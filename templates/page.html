<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}site.css">
<style>
/* back to top: kept in the page so a cached site.css can't hide it */
.totop { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 500 14px/1 var(--mono);
  text-decoration: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity .2s, transform .2s; }
.totop.show { opacity: 1; pointer-events: auto; transform: none; }
.totop:hover, .totop:focus-visible { color: var(--paper); background: var(--moss); }
@media (prefers-reduced-motion: reduce) { .totop { transition: none; } }
</style>
</head>
<body>
<header class="top" id="top"><a href="{{root}}">← Who's holding what now?</a></header>
<main class="prose">
{{body}}
</main>
<footer class="foot"><a href="{{root}}">Home</a> · <a href="{{root}}slides/">Slides</a></footer>
<a class="totop" href="#top" aria-label="Back to top">&uarr; Top</a>
<script>
(function () {
  var b = document.querySelector('.totop');
  function check() { b.classList.toggle('show', window.scrollY > 600); }
  window.addEventListener('scroll', check, { passive: true }); check();
  b.addEventListener('click', function (e) {
    e.preventDefault();
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' });
    history.replaceState(null, '', location.pathname);
    document.getElementById('top').querySelector('a').focus({ preventScroll: true });
  });
})();
</script>
</body></html>
